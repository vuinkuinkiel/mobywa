<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Niezależny projekt demonstracyjny interfejsu użytkownika.">
    <title>Projekt demonstracyjny</title>

    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef5ff, #f7f2ff);
        color: #172033;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: 48px;
        border: 1px solid #d8e2f0;
        border-radius: 24px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 20px 60px rgba(34, 69, 115, .14);
      }

      .badge {
        display: inline-block;
        padding: 7px 11px;
        border-radius: 999px;
        background: #e7f0ff;
        color: #1752a0;
        font-size: .85rem;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 7vw, 3.6rem);
      }

      p {
        max-width: 58ch;
        font-size: 1.1rem;
        line-height: 1.65;
        color: #475569;
      }

      .notice {
        margin-top: 30px;
        padding: 18px;
        border-left: 4px solid #2563eb;
        border-radius: 8px;
        background: #f0f6ff;
        color: #244160;
      }

      footer {
        margin-top: 34px;
        font-size: .9rem;
        color: #64748b;
      }
    </style>
  </head>

  <body>
    <main>
      <span class="badge">Projekt własny</span>
      <h1>Witaj!</h1>
      <p>
        To niezależny projekt demonstracyjny interfejsu.
        Nie jest powiązany z żadną instytucją publiczną ani usługą zewnętrzną.
      </p>
      <div class="notice">
        Strona nie prosi o hasła, dane osobowe, numery dokumentów ani dane płatnicze.
      </div>
      <footer>© 2026 — projekt demonstracyjny</footer>
    </main>
  </body>
</html>
